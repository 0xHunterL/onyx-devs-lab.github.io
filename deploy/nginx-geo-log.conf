map $http_referer $onyx_referrer_host {
    default "";
    ~*^https?://(?<onyx_referrer_domain>[^/:]+) $onyx_referrer_domain;
}

log_format onyx_geo escape=json '{'
    '"time":"$time_iso8601",'
    '"host":"$host",'
    '"clientIp":"$remote_addr",'
    '"proxyIp":"$realip_remote_addr",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"referrerHost":"$onyx_referrer_host",'
    '"userAgent":"$http_user_agent"'
'}';
