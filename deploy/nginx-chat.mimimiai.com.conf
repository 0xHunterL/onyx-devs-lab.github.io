server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat.mimimiai.com;

    ssl_certificate /etc/letsencrypt/live/chat.mimimiai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.mimimiai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32k;

    location = /health {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /v1/ {
        limit_req zone=assistant_per_ip burst=4 nodelay;
        limit_req_status 429;
        limit_conn assistant_conn_per_ip 2;

        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.mimimiai.com;
    return 301 https://$host$request_uri;
}
