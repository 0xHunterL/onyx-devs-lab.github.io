server {
    listen 80;
    listen [::]:80;
    server_name hk.onyxdevslab.com;

    root /root/onyx-devs-lab.github.io/dist;
    index index.html;
    access_log /var/log/nginx/hk.onyxdevslab.com.geo.log onyx_geo;

    # Never cache the SPA shell. A stale shell may reference a previous
    # content-hashed bundle after a deployment.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes" always;
        add_header Link '<https://hk.onyxdevslab.com/sitemap.xml>; rel="sitemap"; type="application/xml", <https://hk.onyxdevslab.com/feed.xml>; rel="alternate"; type="application/atom+xml", <https://hk.onyxdevslab.com/feed.json>; rel="alternate"; type="application/feed+json", <https://hk.onyxdevslab.com/data/enterprise-ai-service-terms.jsonld>; rel="describedby"; type="application/ld+json", <https://hk.onyxdevslab.com/llms.txt>; rel="describedby"; type="text/plain"' always;
    }

    location / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^(.*)/$ $1/index.md last;
        }
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes" always;
        add_header Link '<https://hk.onyxdevslab.com/sitemap.xml>; rel="sitemap"; type="application/xml", <https://hk.onyxdevslab.com/feed.xml>; rel="alternate"; type="application/atom+xml", <https://hk.onyxdevslab.com/feed.json>; rel="alternate"; type="application/feed+json", <https://hk.onyxdevslab.com/data/enterprise-ai-service-terms.jsonld>; rel="describedby"; type="application/ld+json", <https://hk.onyxdevslab.com/llms.txt>; rel="describedby"; type="text/plain"' always;
    }

    location ~ \.md$ {
        try_files $uri =404;
        default_type text/markdown;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes" always;
        add_header Link '<https://hk.onyxdevslab.com/sitemap.xml>; rel="sitemap"; type="application/xml", <https://hk.onyxdevslab.com/feed.xml>; rel="alternate"; type="application/atom+xml", <https://hk.onyxdevslab.com/feed.json>; rel="alternate"; type="application/feed+json", <https://hk.onyxdevslab.com/data/enterprise-ai-service-terms.jsonld>; rel="describedby"; type="application/ld+json", <https://hk.onyxdevslab.com/llms.txt>; rel="describedby"; type="text/plain"' always;
    }

    location = /feed.json {
        types { application/feed+json json; }
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes" always;
        add_header Link '<https://hk.onyxdevslab.com/sitemap.xml>; rel="sitemap"; type="application/xml", <https://hk.onyxdevslab.com/feed.xml>; rel="alternate"; type="application/atom+xml", <https://hk.onyxdevslab.com/feed.json>; rel="alternate"; type="application/feed+json", <https://hk.onyxdevslab.com/data/enterprise-ai-service-terms.jsonld>; rel="describedby"; type="application/ld+json", <https://hk.onyxdevslab.com/llms.txt>; rel="describedby"; type="text/plain"' always;
    }

    location = /data/enterprise-ai-service-terms.jsonld {
        types { application/ld+json jsonld; }
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes" always;
        add_header Link '<https://hk.onyxdevslab.com/sitemap.xml>; rel="sitemap"; type="application/xml", <https://hk.onyxdevslab.com/feed.xml>; rel="alternate"; type="application/atom+xml", <https://hk.onyxdevslab.com/feed.json>; rel="alternate"; type="application/feed+json", <https://hk.onyxdevslab.com/data/enterprise-ai-service-terms.jsonld>; rel="describedby"; type="application/ld+json", <https://hk.onyxdevslab.com/llms.txt>; rel="describedby"; type="text/plain"' always;
    }

    # Content-hashed assets are safe to cache for a long time.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
