server {
    listen 80;
    listen [::]:80;
    server_name hk.onyxdevslab.com;

    root /root/onyx-devs-lab.github.io/dist;
    index index.html;
    access_log /var/log/nginx/hk.onyxdevslab.com.geo.log onyx_geo;

    # Never cache the SPA shell. A stale shell may reference a previous
    # content-hashed bundle after a deployment.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Content-hashed assets are safe to cache for a long time.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
